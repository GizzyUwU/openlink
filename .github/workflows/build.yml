name: "publish"

on:
  workflow_dispatch:

jobs:
  version-bump:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      new-tag: ${{ steps.version-bump.outputs.newTag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: "Skip if only workflow file changed"
        id: skip_check
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)
          echo "Changed files:"
          echo "$CHANGED"
          WORKFLOW_FILE=".github/workflows/publish.yml"

          ONLY_WORKFLOW=true
          for f in $CHANGED; do
            if [ "$f" != "$WORKFLOW_FILE" ]; then
              ONLY_WORKFLOW=false
              break
            fi
          done

          echo "only_workflow=$ONLY_WORKFLOW" >> $GITHUB_OUTPUT

      - name: "Automated Version Bump"
        if: steps.skip_check.outputs.only_workflow == 'false'
        uses: phips28/gh-action-bump-version@master
        id: version-bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          minor-wording: "add,Adds,new,adds,feat"
          major-wording: "MAJOR,cut-major,major"
          patch-wording: "patch,fixes,fix,refactor,style,chore,docs"
          rc-wording: "RELEASE,alpha"

  publish-tauri:
    needs: version-bump
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Disable initramfs update
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf

      - name: Disable man-db update
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: sudo rm -f /var/lib/man-db/auto-update

      - uses: awalsh128/cache-apt-pkgs-action@latest
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        with:
          packages: libwebkit2gtk-4.1 libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev pkg-config libglib2.0-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev libharfbuzz-dev pkg-config xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: yarn install

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0)
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          NEW_TAG=${{ needs.version-bump.outputs.new-tag }}

          echo "## What's Changed" > release_notes.md
          git log $RANGE --pretty=format:"- %s (#%h)" >> release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            REPO_URL="https://github.com/${{ github.repository }}/compare"
            echo "## Full Changelog: [$PREV_TAG...$NEW_TAG]($REPO_URL/$PREV_TAG...$NEW_TAG)" >> release_notes.md
          fi

          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          cat release_notes.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Openlink v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
